name: Publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version and check for existing release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-Content 'SysBot.Pokemon/Helpers/TradeBot.cs' -Raw
          $match = [regex]::Match($source, 'public const string Version\s*=\s*"(v[0-9]+(?:\.[0-9]+){1,3})"')
          if (-not $match.Success) { throw 'Could not read TradeBot.Version.' }
          $tag = $match.Groups[1].Value
          $number = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$number" >> $env:GITHUB_OUTPUT
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          if ($releases.tagName -contains $tag) {
            'publish=false' >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; skipping."
          } else {
            'publish=true' >> $env:GITHUB_OUTPUT
            Write-Host "Preparing release $tag."
          }

      - name: Install .NET 10 SDK
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single EXE
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          dotnet publish SysBot.Pokemon.WinForms/SysBot.Pokemon.WinForms.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.version.outputs.number }} -o release
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          $exe = Join-Path 'release' 'TradeDex_${{ steps.version.outputs.number }}.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Expected release EXE not found: $exe" }

      - name: Create GitHub release with EXE only
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' 'release/TradeDex_${{ steps.version.outputs.number }}.exe' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'TradeDex ${{ steps.version.outputs.tag }}' --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
